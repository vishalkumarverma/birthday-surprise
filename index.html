
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#190d25">
  <title>A Little Surprise ♡</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #190d25;
      color: #fff4ed;
      overflow: hidden;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .7s ease, transform .7s ease;
    }

    #welcome {
      z-index: 5;
      flex-direction: column;
      padding: 24px;
      text-align: center;
      background:
        radial-gradient(circle at 20% 15%,
          rgba(255,143,184,.2), transparent 30%),
        radial-gradient(circle at 85% 80%,
          rgba(255,210,225,.14), transparent 30%),
        linear-gradient(145deg, #421b43, #160c25);
    }

    .eyebrow {
      font: .75rem Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: .25em;
      color: #ffd3e3;
      margin-bottom: 14px;
    }

    h1 {
      font-weight: normal;
      font-size: clamp(2.3rem, 7vw, 4.7rem);
      line-height: 1.08;
      margin: 0 0 15px;
      text-shadow: 0 4px 30px rgba(255,112,170,.3);
    }

    .subtitle {
      font: 1rem/1.7 Arial, sans-serif;
      color: #f4dce8;
      margin: 0 auto 28px;
    }

    .gift-button {
      border: 1px solid rgba(255,255,255,.5);
      color: white;
      cursor: pointer;
      padding: 20px 32px;
      border-radius: 20px;
      background: linear-gradient(135deg,
        #ff8fb8, #c74f93 60%, #8b3f91);
      box-shadow: 0 15px 45px rgba(255,83,157,.3);
      font-size: 1.1rem;
      transition: transform .25s, box-shadow .25s;
      animation: pulse 2s infinite;
    }

    .gift-button:hover {
      transform: translateY(-4px) scale(1.04);
      box-shadow: 0 20px 55px rgba(255,83,157,.45);
    }

    .gift-icon {
      display: block;
      font-size: 3.5rem;
      margin-bottom: 10px;
    }

    .hint {
      margin-top: 20px;
      font: .8rem Arial, sans-serif;
      color: #d7bdcf;
    }

    @keyframes pulse {
      50% {
        box-shadow: 0 15px 55px rgba(255,83,157,.5);
      }
    }

    #surprise {
      z-index: 1;
      opacity: 0;
      pointer-events: none;
      background: #100914;
      overflow: hidden;
    }

    #surprise.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #birthdayPhoto {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #100914;
      animation: photoReveal 1.4s ease both;
    }

    @keyframes photoReveal {
      from {
        opacity: 0;
        transform: scale(1.04);
        filter: blur(5px);
      }
      to {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
      }
    }

    .photo-shade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(10,3,15,.12),
        transparent 25%,
        transparent 70%,
        rgba(10,3,15,.2)
      );
    }

    .heart-rain {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      perspective: 700px;
    }

    .heart {
      position: absolute;
      top: -12vh;
      left: var(--left);
      font-size: var(--size);
      color: var(--heart-color);
      opacity: 0;
      text-shadow:
        0 5px 8px rgba(0,0,0,.3),
        0 0 16px rgba(255,140,190,.3);
      transform-style: preserve-3d;
      animation: heartFall var(--duration)
        linear var(--delay) infinite;
      user-select: none;
      will-change: transform;
    }

    @keyframes heartFall {
      0% {
        transform: translate3d(0,-8vh,-80px)
          rotateY(0deg) rotateZ(0deg) scale(.65);
        opacity: 0;
      }
      8% {
        opacity: var(--opacity);
      }
      45% {
        transform: translate3d(var(--drift),48vh,80px)
          rotateY(180deg) rotateZ(25deg) scale(1.05);
      }
      90% {
        opacity: var(--opacity);
      }
      100% {
        transform: translate3d(
          calc(var(--drift) * -0.5),112vh,-60px
        ) rotateY(360deg) rotateZ(-25deg) scale(.75);
        opacity: 0;
      }
    }

    .message {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 16px;
      transform: translateX(-50%);
      max-width: calc(100% - 25px);
      width: max-content;
      padding: 10px 18px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 999px;
      background: rgba(27,11,31,.5);
      backdrop-filter: blur(9px);
      color: white;
      font-size: clamp(.9rem, 3vw, 1.25rem);
      text-align: center;
      pointer-events: none;
    }

    .controls {
      position: absolute;
      z-index: 3;
      right: 14px;
      bottom: 14px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .control {
      border: 1px solid rgba(255,255,255,.45);
      color: white;
      background: rgba(25,10,30,.72);
      backdrop-filter: blur(10px);
      border-radius: 999px;
      padding: 10px 14px;
      font: .85rem Arial, sans-serif;
      cursor: pointer;
    }

    .control:hover {
      background: rgba(120,35,95,.85);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      .message {
        top: 10px;
        padding: 8px 13px;
      }

      .controls {
        right: 8px;
        bottom: 8px;
      }

      .control {
        padding: 9px 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .heart {
        animation-duration: .01ms;
        animation-iteration-count: 1;
      }
    }
  </style>
</head>

<body>
  <!-- FIRST PAGE: GIFT BOX -->
  <section id="welcome" class="screen">
    <div class="eyebrow">A little something for you</div>

    <h1>Ready for your<br><em>surprise?</em></h1>

    <p class="subtitle">
      I made something special just for you.<br>
      Tap the gift to open it. ♡
    </p>

    <button id="openGift" class="gift-button">
      <span class="gift-icon">🎁</span>
      Click to Open
    </button>

    <div class="hint">Best experienced with your sound on ♫</div>
  </section>

  <!-- SECOND PAGE: PHOTO, MUSIC AND HEARTS -->
  <section id="surprise" class="screen">
    <img
      id="birthdayPhoto"
      src="assets/birthday-collage.jpeg"
      alt="Birthday photo collage"
    >

    <div class="photo-shade"></div>

    <div class="message">
      A little love, just for you ♡
    </div>

    <div id="heartRain" class="heart-rain"></div>

    <div class="controls">
      <button id="soundToggle" class="control">
        ♫ Pause music
      </button>

      <button id="restart" class="control">
        ↻ Replay surprise
      </button>
    </div>
  </section>

  <!-- REPLACE THIS FILE WITH YOUR OWN SONG -->
  <audio
    id="birthdaySong"
    src="assets/birthday-song.mpeg"
    preload="auto"
    loop
  ></audio>

  <script>
    const welcome = document.getElementById("welcome");
    const surprise = document.getElementById("surprise");
    const openGift = document.getElementById("openGift");
    const song = document.getElementById("birthdaySong");
    const soundToggle = document.getElementById("soundToggle");
    const restart = document.getElementById("restart");
    const heartRain = document.getElementById("heartRain");

    let opened = false;

    const heartColors = [
      "#ff5d91",
      "#ff9fc5",
      "#fff0f5",
      "#d9a7ff",
      "#ff6f78",
      "#ffd1e1"
    ];

    function makeHearts() {
      heartRain.innerHTML = "";

      const count = window.innerWidth < 600 ? 24 : 42;

      for (let i = 0; i < count; i++) {
        const heart = document.createElement("span");

        heart.className = "heart";
        heart.textContent = Math.random() > 0.23 ? "♥" : "♡";

        heart.style.setProperty(
          "--left", `${Math.random() * 100}%`
        );

        heart.style.setProperty(
          "--size", `${14 + Math.random() * 30}px`
        );

        heart.style.setProperty(
          "--duration", `${5 + Math.random() * 8}s`
        );

        heart.style.setProperty(
          "--delay", `${-Math.random() * 12}s`
        );

        heart.style.setProperty(
          "--drift", `${-90 + Math.random() * 180}px`
        );

        heart.style.setProperty(
          "--opacity", `${0.42 + Math.random() * 0.55}`
        );

        heart.style.setProperty(
          "--heart-color",
          heartColors[Math.floor(Math.random() * heartColors.length)]
        );

        heartRain.appendChild(heart);
      }
    }

    async function openSurprise() {
      if (opened) return;

      opened = true;

      welcome.style.opacity = "0";
      welcome.style.transform = "scale(1.04)";
      welcome.style.pointerEvents = "none";

      window.setTimeout(() => {
        welcome.classList.add("hidden");
        surprise.classList.add("visible");
      }, 450);

      makeHearts();

      song.currentTime = 0;

      try {
        await song.play();
        soundToggle.textContent = "♫ Pause music";
      } catch (error) {
        soundToggle.textContent = "♫ Play music";
        console.error("Could not play audio:", error);
      }
    }

    openGift.addEventListener("click", openSurprise);

    soundToggle.addEventListener("click", async () => {
      if (song.paused) {
        try {
          await song.play();
          soundToggle.textContent = "♫ Pause music";
        } catch (error) {
          soundToggle.textContent = "♫ Play music";
        }
      } else {
        song.pause();
        soundToggle.textContent = "♫ Play music";
      }
    });

    restart.addEventListener("click", async () => {
      song.currentTime = 0;

      try {
        await song.play();
        soundToggle.textContent = "♫ Pause music";
      } catch (error) {
        soundToggle.textContent = "♫ Play music";
      }

      makeHearts();
    });

    window.addEventListener("resize", () => {
      if (opened) makeHearts();
    });
  </script>
</body>
</html>
